                  </div>

                  </div>

                  </div>



                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Reffered</label>
                    <input type="number" class="form-control" id="exampleInputnum1">
                  </div>



                  
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Author Status</label>

                        <option value="2">21-22</option>
                        <option value="3">22-23</option>
                        <option value="3">23-24</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Comments</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="9"></textarea>
                  </div>




                  <div class="mb-3">
                    <button class="form-control  bg-primary text-white" id="button1">Publish Post</button>
                  </div>

            </div>
