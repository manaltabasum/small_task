  <body>
   
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 offset-md-5">
               <img id="myImage" src="images/underocean.jpg" height="400" alt="">
               
               
            </div>
            <div class="row mt-5 ">

             <div class="col-md-2 offset-md-2"> 
                <button id="dolphin" class="p-2 btn btn-success" onclick="document.getElementById('myImage').src='images/dolphin.jpg'">Dolphin</button>
             </div>
            <div class="col-md-2">
                <button class="p-2 btn btn-success"  onclick="document.getElementById('myImage').src='images/jellyfish.jpg'">jellyfish</button>
            </div>
            <div class="col-md-2">
                <button class="p-2 btn btn-success"  onclick="document.getElementById('myImage').src='images/stingray.jpg'">stingray</button>
            </div>
            <div class="col-md-2">
                <button class="p-2 btn btn-success"  onclick="document.getElementById('myImage').src='images/tutle.jpg'">Turtle</button>
            </div> 
            <div class="col-md-2">
                <button class="p-2 btn btn-success"  onclick="document.getElementById('myImage').src='images/shark.jpg'">Shark</button>
            </div> 

            </div>
           
        </div>
    </div>


    <div class="container">
        <div class="row">
            <div class="col-md-4 offset-md-4">

            <p id="para" class="mt-5 border border-secondary p-2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam, in quisquam. Sed at esse numquam provident odio, deserunt itaque maxime....</p>
            


            <button class="p-2 mb-5 btn btn-secondary " onclick="document.getElementById('para').innerHTML='Lorem ipsum dolor sit, amet consectetur adipisicing elit. Placeat numquam obcaecati veniam quia incidunt unde in reiciendis ipsum quibusdam non ad, doloribus nulla, laudantium beatae, facilis praesentium distinctio? Consectetur, aut'">Read more</button>

            <button class="p-2 mb-5 btn btn-secondary " onclick="document.getElementById('para').style.background='skyblue'">
                Change color
            </button>

            </div>
        </div>
    </div>
